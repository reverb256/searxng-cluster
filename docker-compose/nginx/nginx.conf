# NGINX Load Balancer for SearXNG Cluster
# Provides round-robin load balancing with health checks

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Buffer settings
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # Upstream cluster (load-balanced SearXNG instances)
    upstream searxng_backend {
        # Load balancing method: least_conn distributes to instance with fewest connections
        least_conn;

        # SearXNG instances with weights (instance 1 gets more traffic)
        server searxng-1:8080 weight=3 max_fails=3 fail_timeout=30s;
        server searxng-2:8080 weight=2 max_fails=3 fail_timeout=30s;
        server searxng-3:8080 weight=1 max_fails=3 fail_timeout=30s;

        # Keepalive connections to upstream
        keepalive 32;
        keepalive_timeout 60s;
        keepalive_requests 100;
    }

    # Rate limiting zone (optional, prevents abuse)
    limit_req_zone $binary_remote_addr zone=searxng_limit:10m rate=10r/s;

    # Cache settings (optional proxy cache)
    proxy_cache_path /var/cache/nginx
                     levels=1:2
                     keys_zone=searxng_cache:10m
                     max_size=100m
                     inactive=60m
                     use_temp_path=off;

    # Main server block
    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Health check endpoint (always accessible)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Nginx status endpoint (for monitoring)
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.28.0.0/16;  # Docker network
            deny all;
        }

        # Upstream health check (shows which instances are healthy)
        location /upstream_health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","upstream":"searxng_backend","instances":["searxng-1:8080","searxng-2:8080","searxng-3:8080"]}\n';
        }

        # Main SearXNG proxy
        location / {
            # Rate limiting (optional)
            limit_req zone=searxng_limit burst=20 nodelay;

            # Proxy to upstream
            proxy_pass http://searxng_backend;

            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # HTTP/1.1 for keepalive
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Timeouts (SearXNG can be slow with multiple engines)
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 32 8k;

            # Error handling
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 30s;

            # Disable proxy cache for search results (always fresh)
            proxy_cache_bypass $http_cache_control;
            proxy_no_cache $http_cache_control;
        }

        # Search endpoint (with optional caching)
        location /search {
            # Rate limiting
            limit_req zone=searxng_limit burst=30 nodelay;

            # Proxy to upstream
            proxy_pass http://searxng_backend;

            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # HTTP/1.1 for keepalive
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Timeouts for search (can take longer)
            proxy_connect_timeout 45s;
            proxy_send_timeout 45s;
            proxy_read_timeout 45s;

            # Error handling
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        # JSON endpoint (for MCP integration)
        location /config {
            # No rate limiting for internal use
            proxy_pass http://searxng_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Static files (can be cached)
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://searxng_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Cache static files
            proxy_cache searxng_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;

            add_header X-Cache-Status $upstream_cache_status;
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            return 500 "SearXNG temporarily unavailable\n";
            add_header Content-Type text/plain;
        }
    }
}
