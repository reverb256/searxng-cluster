apiVersion: v1
data:
  settings.yml: |
    # SearXNG minimal configuration
    use_default_settings: true
    server:
      limiter: false
      secret_key: "${SEARXNG_SECRET}"
      method: "GET"
      port: 8080

    # Completely disable limiter and rate limiting
    limiter: false

    # Completely disable bot detection
    bot_detection:
      enabled: false

    # Additional bot detection modules to disable
    limiter:
      enabled: false

    search:
      formats:
        - html
        - json
      language: en
      safe_search: 0
      # CRITICAL: Global timeout for all search requests (in seconds)
      # This applies to each engine query
      max_request_timeout: 14.0

    # CRITICAL: Configure HTTP client timeouts
    # These settings control how long SearXNG waits for search engines
    client:
      timeout: 12.0  # Total timeout for HTTP requests
      connect_timeout: 5.0  # Time to establish connection
      read_timeout: 8.0  # Time to read response

    # Disable all access control for cluster use
    ui:
      static_use_hash: true
      default_theme: simple

    # Disable rate limiting completely
    result_proxy:
      enabled: false

    engines:
      # Bot-friendly engines with increased timeout
      - name: duckduckgo
        paging: true
        timeout: 10.0  # Engine-specific timeout override

      - name: brave
        paging: true
        timeout: 10.0

      - name: startpage
        paging: true
        timeout: 10.0

      - name: wikipedia
        paging: true
        timeout: 10.0

      - name: stackoverflow
        paging: true
        timeout: 10.0

      - name: github
        paging: true
        timeout: 10.0

      # Disabled due to 403 errors
      # - name: google
      #   paging: true
      # - name: bing
      #   paging: true

    # Disable limiter completely for API access
    limiter: false
