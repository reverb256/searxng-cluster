---
# SearXNG Settings ConfigMap
# Mounted read-only at /etc/searxng/settings.yml
# Regenerate on change: kubectl rollout restart deploy/searxng -n search
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: search
  labels:
    app: searxng
data:
  settings.yml: |
    use_default_settings: true

    server:
      limiter: false
      secret_key: "REDACTED_SEARXNG_SECRET_KEY"
      image_proxy: true
      method: "GET"
      port: 8080
      bind_address: "0.0.0.0"

    search:
      formats:
        - html
        - csv
        - json
        - rss
      language: en
      safe_search: 0

    outgoing:
      request_timeout: 10.0
      max_request_timeout: 15.0
      pool_connections: 100
      pool_maxsize: 50
      enable_http2: true
      retries: 2
      retry_on_http_error:
        - 403
        - 429
        - 500
        - 502
        - 503
        - 504

    valkey:
      url: valkey://valkey.search.svc.cluster.local:6379/0

    engines:
      # ── General ──
      - name: google
      - name: duckduckgo
      - name: bing
      - name: brave
      - name: startpage

      # ── IT ──
      - name: github
      - name: stackoverflow
      - name: reddit
      - name: hackernews
      - name: mdn
      - name: gitlab
      - name: npm
      - name: pypi
      - name: docker hub
      - name: huggingface

      # ── Science ──
      - name: google scholar
      - name: arxiv
      - name: pubmed
      - name: semantic scholar
      - name: wikipedia
      - name: wikidata

      # ── News ──
      - name: google news
      - name: bing news
      - name: duckduckgo news
      - name: reuters

      # ── Wikis (explicitly enabled) ──
      - name: nixos wiki

